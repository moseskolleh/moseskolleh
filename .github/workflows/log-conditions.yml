# Daily readings — refresh the Rhine + CO2 panel every morning.
# The updater is fail-soft: if a data source is down it exits 0 without
# writing, the previous dated reading stands, and no commit is made.

name: log-conditions

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: log-conditions
  cancel-in-progress: false

jobs:
  daily-reading:
    if: github.repository == 'moseskolleh/moseskolleh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Take the sounding
        run: python3 scripts/update_surface_conditions.py

      - name: Commit if the reading changed
        run: |
          if ! git diff --quiet -- assets README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets README.md
            git commit -m "daily reading: $(date -u +%F) [skip ci]"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push
          else
            echo "Sources unavailable or unchanged — nothing to commit."
          fi
